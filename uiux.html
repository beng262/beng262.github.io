  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    main.sub { padding: 64px 0 40px; }
    .page-head { max-width: 760px; margin-bottom: 56px; }
    .page-head h1 { font-size: clamp(40px, 6vw, 72px); margin: 18px 0 16px; }
    .page-head p { color: var(--muted); font-size: 18px; margin: 0; }
    .concept { margin-bottom: 72px; }
    .concept-head { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; margin-bottom: 20px; }
    .concept h2 { font-size: clamp(28px, 3.4vw, 40px); margin: 10px 0 10px; }
    .concept p { color: var(--muted); margin: 0; max-width: 640px; }
    .concept .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .count { font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
    .rail { display: flex; gap: 18px; overflow-x: auto; padding: 10px 4px 22px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
    .phone { flex: none; width: 220px; scroll-snap-align: start; border-radius: 30px; padding: 8px; background: #0b0b12; border: 1px solid var(--line-2); box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); cursor: zoom-in; transition: transform .3s; }
    .phone:hover { transform: translateY(-6px); }
    .phone img { width: 100%; height: auto; aspect-ratio: 9 / 20; object-fit: cover; object-position: top; border-radius: 23px; background: #15151f; }
    .phone figcaption { font-size: 12px; color: #a1a1b5; text-align: center; padding: 8px 4px 2px; }
    .lb { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(3,3,6,.9); backdrop-filter: blur(6px); padding: 24px; }
    .lb.open { display: grid; }
    .lb img { max-height: 86vh; max-width: 92vw; width: auto; border-radius: 22px; border: 1px solid rgba(255,255,255,.14); }
    .lb figcaption { text-align: center; color: #a1a1b5; margin-top: 12px; font-size: 14px; }
    .lb button { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; display: grid; place-items: center; }
    .lb .prev { left: 18px; } .lb .next { right: 18px; } .lb .x { top: 22px; right: 22px; transform: none; }
    @media (max-width: 680px) {
      .concept-head { grid-template-columns: 1fr; }
      .phone { width: 180px; }
      .lb .prev, .lb .next { top: auto; bottom: 18px; transform: none; }
    }
  </style>
</head>
<body>
  <script src="assets/icons.js"></script>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="grain" aria-hidden="true"></div>
  <header class="nav" id="nav">
    <div class="wrap">

      <nav class="nav-links" id="navLinks" aria-label="Main">
        <a href="index.html#bagent">B-Agent</a>
        <a href="index.html#projects">Projects</a>
        <a href="uiux.html" class="on" aria-current="page">UI / UX</a>
        <a href="art.html">Art</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme"><svg class="ic sun" aria-hidden="true"><use href="#i-sun"></use></svg><svg class="ic moon" aria-hidden="true"><use href="#i-moon"></use></svg></button>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks"><svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg></button>
    </div>
  </header>

  <main class="wrap sub">
    <div class="page-head reveal">
      <span class="eyebrow">UI / UX</span>
      <h1>App concepts, <span class="serif grad">screen by screen.</span></h1>
      <p>Three mobile apps I designed end to end: onboarding, sign-in, the core flow and the paywall. Tap a screen to see it full size.</p>
    </div>
    <div id="concepts"></div>
  </main>

  <footer class="foot"><div class="wrap"><span>© 2026 Bengisu Saraç</span><a href="index.html">Back to home</a></div></footer>

  <figure class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screen viewer">
    <div><img id="lbImg" alt="" /><figcaption id="lbCap"></figcaption></div>
    <button class="prev" id="lbPrev" aria-label="Previous"><svg class="ic" aria-hidden="true"><use href="#i-left"></use></svg></button>
    <button class="next" id="lbNext" aria-label="Next"><svg class="ic" aria-hidden="true"><use href="#i-right"></use></svg></button>
    <button class="x" id="lbX" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg></button>
  </figure>

  <script src="assets/site.js"></script>
  <script src="assets/uiux.js"></script>
</body>
</html>
