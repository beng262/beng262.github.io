<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>UI / UX – Bengisu Saraç</title>
  <meta name="description" content="Mobile apps designed by Bengisu Saraç: WhatNow, a wallpaper store and a fortune-teller app." />
  <meta property="og:title" content="UI / UX work – Bengisu Saraç" />
  <meta property="og:image" content="https://beng262.github.io/img/og.png" />
  <link rel="canonical" href="https://beng262.github.io/uiux.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    main.sub { padding: 0 0 40px; }
    .eyebrow { font-size: 13px; font-weight: bold; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    .page-head { max-width: 760px; margin-bottom: 40px; }
    .page-head h1 { font-size: clamp(32px, 5vw, 48px); margin: 6px 0 12px; color: var(--head); text-shadow: var(--head-shadow); }
    .page-head p { color: var(--ink); font-size: 17px; margin: 0; }
    .concept { margin-bottom: 72px; }
    .concept-head { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; margin-bottom: 20px; }
    .concept h2 { font-size: clamp(24px, 3vw, 32px); margin: 6px 0 8px; color: var(--head); text-shadow: var(--head-shadow); }
    .concept p { color: var(--ink); margin: 0; max-width: 640px; }
    .concept .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .count { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
    .rail { display: flex; gap: 18px; overflow-x: auto; padding: 10px 4px 22px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
    .phone { flex: none; width: 220px; scroll-snap-align: start; border-radius: 30px; padding: 8px; background: #111827; border: 1px solid var(--card-line); box-shadow: var(--shadow); cursor: zoom-in; transition: transform .3s; }
    .phone:hover { transform: translateY(-6px); }
    .phone img { width: 100%; height: auto; aspect-ratio: 9 / 20; object-fit: cover; object-position: top; border-radius: 23px; background: #15151f; }
    .phone figcaption { font-size: 12px; color: #a1a1b5; text-align: center; padding: 8px 4px 2px; }
    .lb { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(3,3,6,.9); backdrop-filter: blur(6px); padding: 24px; }
    .lb.open { display: grid; }
    .lb img { max-height: 86vh; max-width: 92vw; width: auto; border-radius: 22px; border: 1px solid rgba(255,255,255,.14); }
    .lb figcaption { text-align: center; color: #a1a1b5; margin-top: 12px; font-size: 14px; }
    .lb button { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; display: grid; place-items: center; }
    .lb .prev { left: 18px; } .lb .next { right: 18px; } .lb .x { top: 22px; right: 22px; transform: none; }
    @media (max-width: 680px) {
      .concept-head { grid-template-columns: 1fr; }
      .phone { width: 180px; }
      .lb .prev, .lb .next { top: auto; bottom: 18px; transform: none; }
    }
  </style>
</head>
<body>
  <script src="assets/icons.js"></script>

  <main class="wrap sub">
    <div class="top"><span></span><a class="back" href="index.html#craft"><svg class="ic" aria-hidden="true"><use href="#i-left"></use></svg> Back</a></div>
    <div class="page-head reveal">
      <h1>UI / UX: app concepts, screen by screen</h1>
      <p>Three mobile apps I designed end to end: onboarding, sign-in, the core flow and the paywall. Tap a screen to see it full size.</p>
    </div>
    <div id="concepts"></div>
  </main>

  <footer class="foot">© 2026 Bengisu Saraç · <a href="index.html">Back to home</a></footer>

  <figure class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screen viewer">
    <div><img id="lbImg" alt="" /><figcaption id="lbCap"></figcaption></div>
    <button class="prev" id="lbPrev" aria-label="Previous"><svg class="ic" aria-hidden="true"><use href="#i-left"></use></svg></button>
    <button class="next" id="lbNext" aria-label="Next"><svg class="ic" aria-hidden="true"><use href="#i-right"></use></svg></button>
    <button class="x" id="lbX" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg></button>
  </figure>

  <script src="assets/site.js"></script>
  <script src="assets/uiux.js"></script>
</body>
</html>
