<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<script src="assets/theme.js"></script>

<title>Art – Bengisu Saraç</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/site.css" />
<style>
  :root{
    --gradient: linear-gradient(135deg,#99CDEB,#FFB6D9);
    --card-bg: rgba(255,255,255,0.04);
    --muted: rgba(255,255,255,0.9);
    --btn-hover: rgba(255,255,255,0.12);
  }
  html, body { height: 100%; }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--gradient);
    background-size: cover;
    color:white;
    padding:22px;
    min-height:100vh;
  }
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  h1{margin:0}
  .back{
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:8px;
    transition:background 0.22s ease, transform 0.12s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .back:hover{
    background:var(--btn-hover);
    transform:translateY(-2px);
  }
  .intro{
    margin-top:14px;
    max-width:680px;
    line-height:1.6;
    color:var(--muted);
  }
  .cta-row{
    margin-top:18px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .cta{
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.16);
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:25px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:transform .2s, box-shadow .2s;
  }
  .cta:hover{transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,0.18)}

  .grid{
    margin-top:26px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card-bg);
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.06);
    transition:transform .15s, box-shadow .15s;
    display:flex;
    flex-direction:column;
  }
  .card:hover{transform:translateY(-6px); box-shadow:0 10px 30px rgba(0,0,0,0.2)}
  .thumb{width:100%;height:200px;display:block;background:rgba(255,255,255,0.03)}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#f5f5f5}
  .card-body{padding:12px;text-align:left}
  .title{font-weight:700;margin-bottom:4px}
  .meta{font-size:13px;color:var(--muted)}

  /* Shared theme (assets/site.css) owns the background and dark mode */
  body{background:transparent!important;padding:0!important;color:var(--ink)}
  main.sub{padding:22px 0 40px}
  .top h1{color:var(--head);text-shadow:var(--head-shadow)}
  .intro{color:var(--ink)!important;font-size:17px}
  .cta{color:#fff!important;border-color:#fff!important;background:transparent!important}
  .card{background:var(--card)!important;border:1px solid var(--card-line)!important;border-radius:16px!important;box-shadow:var(--shadow);color:var(--ink)!important}
  .meta{color:var(--ink-3)!important}
</style>
</head>
<body>
  <script src="assets/icons.js"></script>
  <main class="wrap sub">


  <div class="top">
    <h1>Art</h1>
    <div>
      <a class="back" href="index.html" aria-label="Back to home"><svg class="ic" aria-hidden="true"><use href="#i-left"></use></svg> Back</a>
    </div>
  </div>

  <p class="intro">
    Illustration, 2D and 3D work. I draw and model outside of engineering, and it feeds
    directly into how I approach interface and product design. The full, regularly updated
    gallery lives on ArtStation.
  </p>

  <div class="cta-row">
    <a class="cta" href="https://bengisrc.artstation.com" target="_blank" rel="noopener">
      <svg class="ic" aria-hidden="true"><use href="#i-artstation"></use></svg> View full portfolio on ArtStation
    </a>
    <a class="cta" href="uiux.html">
      <svg class="ic" aria-hidden="true"><use href="#i-layers"></use></svg> See UI / UX work
    </a>
  </div>

  <!-- Add a piece: drop the image into img/ and add a line to the pieces list below. -->
  <div class="grid" id="grid"></div>

<script src="assets/site.js"></script>
<script src="assets/art.js"></script>

  </main>
  <footer class="foot">© 2026 Bengisu Saraç · <a href="index.html">Back to home</a></footer>
</body>
</html>
