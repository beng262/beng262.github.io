<style>
  .art-hero { padding: 6px 0 26px; max-width: 720px; }
  .art-hero h1 { font-size: clamp(34px, 5vw, 48px); color: var(--head); text-shadow: var(--head-shadow); margin: 6px 0 12px; }
  .art-hero p { font-size: 17px; margin: 0 0 20px; color: var(--ink); }
  .art-hero .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .filters { justify-content: flex-start; }

  /* Masonry: pieces keep their own shape */
  .gallery { columns: 3 300px; column-gap: 20px; }
  .piece { break-inside: avoid; margin: 0 0 20px; overflow: hidden; border-radius: var(--radius); background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow); transition: transform 0.3s, box-shadow 0.3s; }
  .piece:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
  .piece[hidden] { display: none; }
  .shot { position: relative; display: block; width: 100%; padding: 0; border: 0; background: var(--card-solid); cursor: zoom-in; overflow: hidden; }
  .shot img { width: 100%; height: auto; transition: transform 0.6s; }
  .piece:hover .shot img { transform: scale(1.03); }
  .count { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font: bold 12px var(--font); color: #fff; background: rgba(16, 20, 44, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .piece figcaption { padding: 14px 16px 16px; display: grid; gap: 3px; }
  .piece b { font-size: 17px; color: var(--ink); }
  .piece .kind { font-size: 13px; color: var(--ink-3); }
  .piece .note { font-size: 14.5px; color: var(--ink-2); margin-top: 4px; }
  .piece a { justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13.5px; font-weight: bold; color: var(--accent); text-decoration: none; }
  .piece a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <script src="assets/icons.js"></script>
  <main class="wrap">
    <div class="top">
      <a class="back" href="index.html#craft"><svg class="ic" aria-hidden="true"><use href="#i-left"></use></svg> Back</a>
    </div>

    <header class="art-hero">
      <h1>Art</h1>
      <p>I've drawn since I was a kid and painted digitally since fourteen, on a tablet I bought with my savings. Portraits and characters are my favourite; I also make illustration, 3D and the art for my own games.</p>
      <div class="row">
        <a class="btn solid" href="https://bengisrc.artstation.com" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-artstation"></use></svg> ArtStation</a>
        <a class="btn" href="uiux.html"><svg class="ic" aria-hidden="true"><use href="#i-layers"></use></svg> UI / UX work</a>
      </div>
    </header>

    <div class="filters" id="cats" role="group" aria-label="Filter by kind"></div>
    <div class="gallery" id="gallery"></div>
  </main>

  <footer class="foot">© 2026 Bengisu Saraç · <a href="index.html">Back to home</a></footer>

  <figure class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div><img id="lbImg" alt="" /><figcaption id="lbCap"></figcaption></div>
    <button class="prev" id="lbPrev" aria-label="Previous"><svg class="ic" aria-hidden="true"><use href="#i-left"></use></svg></button>
    <button class="next" id="lbNext" aria-label="Next"><svg class="ic" aria-hidden="true"><use href="#i-right"></use></svg></button>
    <button class="x" id="lbX" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg></button>
  </figure>

  <script src="assets/site.js"></script>
  <script src="assets/art.js"></script>
</body>
</html>
