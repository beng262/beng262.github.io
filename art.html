<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Art — Bengisu Sarac</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<style>
  :root{
    --gradient: linear-gradient(135deg,#99CDEB,#FFB6D9);
    --card-bg: rgba(255,255,255,0.04);
    --muted: rgba(255,255,255,0.9);
    --btn-hover: rgba(255,255,255,0.12);
  }
  html, body { height: 100%; }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--gradient);
    background-size: cover;
    color:white;
    padding:22px;
    min-height:100vh;
  }
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  h1{margin:0}
  .back{
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:8px;
    transition:background 0.22s ease, transform 0.12s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .back:hover{
    background:var(--btn-hover);
    transform:translateY(-2px);
  }
  .intro{
    margin-top:14px;
    max-width:680px;
    line-height:1.6;
    color:var(--muted);
  }
  .cta-row{
    margin-top:18px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .cta{
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.16);
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:25px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:transform .2s, box-shadow .2s;
  }
  .cta:hover{transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,0.18)}

  .grid{
    margin-top:26px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card-bg);
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.06);
    transition:transform .15s, box-shadow .15s;
    display:flex;
    flex-direction:column;
  }
  .card:hover{transform:translateY(-6px); box-shadow:0 10px 30px rgba(0,0,0,0.2)}
  .thumb{width:100%;height:200px;display:block;background:rgba(255,255,255,0.03)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card-body{padding:12px;text-align:left}
  .title{font-weight:700;margin-bottom:4px}
  .meta{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

  <div class="top">
    <h1>Art</h1>
    <div>
      <a class="back" href="index.html" aria-label="Back to home">← Back</a>
    </div>
  </div>

  <p class="intro">
    Illustration, 2D and 3D work. I draw and model outside of engineering, and it feeds
    directly into how I approach interface and product design. The full, regularly updated
    gallery lives on ArtStation.
  </p>

  <div class="cta-row">
    <a class="cta" href="https://bengisrc.artstation.com" target="_blank" rel="noopener">
      <i class="fab fa-artstation"></i> View full portfolio on ArtStation
    </a>
    <a class="cta" href="uiux.html">
      <i class="fas fa-object-group"></i> See UI / UX work
    </a>
  </div>

  <!-- TODO Bengisu: replace the three src values below with real image URLs
       (drop the files into this repo, e.g. /img/piece-1.jpg, and use a relative path).
       Until then each card falls back to a neutral placeholder. -->
  <div class="grid" id="grid"></div>

<script>
  const pieces = [
    { title: "Digital Illustration", meta: "Photoshop", image: "" },
    { title: "Character Work",       meta: "Photoshop", image: "" },
    { title: "3D Modeling",          meta: "Blender",   image: "" }
  ];

  const grid = document.getElementById("grid");
  pieces.forEach(p => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = "https://bengisrc.artstation.com";
    card.target = "_blank";
    card.rel = "noopener";
    card.style.textDecoration = "none";
    card.style.color = "white";

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.alt = p.title;
    const fallback = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800'><rect width='100%' height='100%' fill='#0F1724'/><text x='50%' y='50%' fill='#9CC7EB' font-family='Arial' font-size='34' text-anchor='middle' dominant-baseline='middle'>${p.title}</text></svg>`
    );
    img.src = p.image || fallback;
    img.onerror = () => { img.src = fallback; };
    thumb.appendChild(img);

    const body = document.createElement("div");
    body.className = "card-body";
    const t = document.createElement("div"); t.className = "title"; t.textContent = p.title;
    const m = document.createElement("div"); m.className = "meta"; m.textContent = p.meta;
    body.appendChild(t); body.appendChild(m);

    card.appendChild(thumb); card.appendChild(body);
    grid.appendChild(card);
  });
</script>

</body>
</html>
